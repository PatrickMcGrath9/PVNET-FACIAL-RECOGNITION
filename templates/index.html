<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facial Recognition Client</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=0.01" />
</head>
<body>
    <h1>Client is Running</h1>

    <div id="status-container">
        <p>FaceManager Status: <span id="facemanager-status">Initializing...</span></p>
        <p>DatabaseManager Status: <span id="databasemanager-status">Waiting...</span></p>
    </div>

    <div id="controls">
        <button id="toggle-options">Options ▼</button>

        <div id="options-dropdown">
            <label><input type="checkbox" id="detect" checked> Detect Faces</label><br />
            <label><input type="checkbox" id="identify" checked> Identify Faces</label>
        </div>

        <br />
        <button id="start-btn" disabled>Start</button>
    </div>

    <img id="video" src="" style="max-width:100%; height:auto;" />

    <script src="/static/js/main.js?v=0.08"></script>
</body>
</html>
